name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Static analysis (ESLint)
        working-directory: frontend
        run: npm run lint

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Start the system with Docker Compose
        run: docker compose up -d --build

      - name: Wait for the API to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Run unit and system tests
        working-directory: api
        run: npm test

      - name: Show container logs if something failed
        if: failure()
        run: docker compose logs

      - name: Stop the system
        if: always()
        run: docker compose down

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish API image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            ghcr.io/varshini0402/mal3020-workout-tracker-api:latest
            ghcr.io/varshini0402/mal3020-workout-tracker-api:${{ github.sha }}

      - name: Publish WebSocket image
        uses: docker/build-push-action@v6
        with:
          context: ./websocket
          push: true
          tags: |
            ghcr.io/varshini0402/mal3020-workout-tracker-websocket:latest
            ghcr.io/varshini0402/mal3020-workout-tracker-websocket:${{ github.sha }}

      - name: Publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/varshini0402/mal3020-workout-tracker-frontend:latest
            ghcr.io/varshini0402/mal3020-workout-tracker-frontend:${{ github.sha }}