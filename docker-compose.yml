services:
  mongo:
    image: mongo:7
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db

  api:
    build: ./api
    ports:
      - "3000:3000"
    environment:
      MONGO_URL: mongodb://mongo:27017/workouts
      WS_URL: http://websocket:4000
      JWT_SECRET: dev-secret-change-me
      INTERNAL_KEY: dev-internal-key
    depends_on:
      - mongo
      - websocket

  websocket:
    build: ./websocket
    ports:
      - "4000:4000"
    environment:
      JWT_SECRET: dev-secret-change-me
      INTERNAL_KEY: dev-internal-key

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  mongo-data: